<!doctype html>
<html lang="en">
<head>

<title>Saint Martin — Resort Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--ink:#17373b;--muted:#61797b;--sea:#dceff0;--line:#dce7e5;--green:#13796f;--amber:#bd7935}
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden;background:var(--sea)}#map{position:fixed;inset:0;background:#dceff0}
.leaflet-container{font:inherit}.leaflet-control-zoom{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:0 5px 20px #173b4020!important}.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;border:0!important;color:#173d42!important}.leaflet-control-attribution{font-size:10px!important;background:#ffffffdf!important}
.top-label{position:absolute;z-index:700;top:14px;left:14px;padding:8px 11px;border:1px solid #d8e5e2;border-radius:12px;background:#ffffffed;box-shadow:0 5px 22px #173b4020;font-size:11px;font-weight:800;letter-spacing:.08em;color:#294d50;pointer-events:none}
.compass{position:absolute;z-index:700;top:14px;right:14px;width:76px;height:76px;border:1px solid #d8e5e2;border-radius:50%;background:#ffffffed;box-shadow:0 5px 22px #173b4020;display:grid;grid-template:1fr 1fr 1fr/1fr 1fr 1fr;place-items:center;font-size:10px;font-weight:850;color:#294d50;pointer-events:none}.compass .n{grid-area:1/2;color:#b24e3e;font-size:13px}.compass .e{grid-area:2/3}.compass .s{grid-area:3/2}.compass .w{grid-area:2/1}.compass .star{grid-area:2/2;font-size:22px;color:#b24e3e}
.legend{position:absolute;z-index:700;left:12px;bottom:25px;display:flex;gap:12px;padding:9px 11px;border:1px solid #d8e5e2;border-radius:12px;background:#ffffffed;box-shadow:0 5px 22px #173b4020;font-size:11px;color:#36565a;pointer-events:none}.legend span{display:flex;gap:5px;align-items:center;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.resort{background:var(--green)}.dot.place{background:var(--amber)}
.resort-icon{width:29px;height:29px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);background:var(--green);border:2px solid white;box-shadow:0 2px 9px #0d414550;display:flex;align-items:center;justify-content:center;color:white;font-weight:900}.resort-icon b{transform:rotate(45deg);font-size:10px}.place-icon{width:29px;height:29px;border-radius:50%;background:var(--amber);border:2px solid white;box-shadow:0 2px 9px #5a371d55;display:flex;align-items:center;justify-content:center;color:white;font-size:15px}
.leaflet-tooltip{border:0!important;border-radius:8px!important;box-shadow:0 3px 12px #123b4025!important;color:#21464a!important;font-weight:750!important;font-size:11px!important;padding:5px 8px!important}
.leaflet-popup-content-wrapper{padding:0!important;border-radius:16px!important;overflow:hidden;box-shadow:0 12px 38px #173b4030!important}.leaflet-popup-content{margin:0!important;width:min(350px,calc(100vw - 68px))!important;max-height:min(66vh,560px);overflow:auto}.leaflet-popup-tip{box-shadow:0 4px 10px #173b4015}
.info{font-size:12px;line-height:1.45;color:var(--ink)}.info-head{padding:14px 15px 11px;background:linear-gradient(135deg,#f1f8f6,#e5f1ee);border-bottom:1px solid var(--line)}.kicker{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--green);font-weight:850;margin-bottom:5px}.info h2{font-size:17px;line-height:1.2;margin:0;color:#18383d}.sub{font-size:10px;color:var(--muted);margin-top:5px}.info-body{padding:12px 15px 14px}.section{margin-bottom:11px}.section:last-child{margin-bottom:0}.section-title{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:#6b8183;font-weight:850;margin-bottom:5px}.rooms{margin:0;padding-left:16px}.rooms li{margin:3px 0}.rate{font-weight:850;color:#155f57}.capacity{font-size:10px;color:#536e70;margin-top:4px}.notice{padding:8px 9px;background:#fff8e9;border:1px solid #f0dfb9;border-radius:9px;color:#765827;font-size:10px;margin-top:8px}.sources{display:flex;gap:9px;flex-wrap:wrap}.sources a{font-size:10px;color:#13796f;text-decoration:underline;text-underline-offset:2px}.actions{display:flex;gap:7px;margin-top:10px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:33px;padding:7px 10px;border-radius:9px;text-decoration:none;font-weight:800;font-size:10px}.actions .primary{background:#13796f;color:white}.actions .secondary{border:1px solid #d4e1de;color:#31575a;background:white}.small{font-size:10px;color:#64797b}
.landmark{padding:13px 15px}.landmark h2{font-size:16px;margin:0 0 5px}.landmark p{font-size:11px;color:#60777a;margin:0}
@media(max-width:600px){.top-label{top:10px;left:10px;font-size:10px;padding:7px 9px}.compass{top:10px;right:10px;width:65px;height:65px}.legend{left:9px;bottom:24px;gap:9px;padding:8px 9px;font-size:10px}.leaflet-control-zoom{margin:10px!important}.leaflet-popup-content{max-height:61vh}}
</style>
</head>
<body>
<div id="map" aria-label="Interactive map of Saint Martin's Island"></div>
<div class="top-label">SAINT MARTIN · BANGLADESH</div>
<div class="compass" aria-label="North East South West compass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><span class="star">✦</span></div>
<div class="legend"><span><i class="dot resort"></i> Resorts</span><span><i class="dot place"></i> Places</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const resorts = [
 {name:"Shomudro Kutir Resort",lat:20.625054,lng:92.320211,map:"https://maps.app.goo.gl/nMpSZiLN6TvGRhFSA",rooms:["Super Deluxe Double — ৳4,000/night · listed for 4 adults · 1 double bed","Prime Family — ৳5,000/night · listed with 2 double beds"],rate:"Published listing: ৳4,000–৳5,000 per room/night",phone:"+8801833755556",capacity:"The Prime Family room listing states 2 double beds; confirm its actual guest capacity directly.",facilities:["Beachside accommodation in the Konapara area."],note:"Room rates are published online and may change by date or season. Ask for two rooms for five adults and confirm the bed setup.",sources:[["Room categories & rates","https://porivromon.com/hotel/somudro-kutir-resort/"],["Public contact listing","https://bdplaces.com/place/somudro-kutir-resort/"]]},
 {name:"Coral Haze Beach Resort",lat:20.633741,lng:92.319644,map:"https://maps.app.goo.gl/2W9D3KYKMnfypJsC9",rooms:["Superior Beach Villa — ৳10,000/night · 4 rooms","Deluxe Beach Villa — ৳12,000/night · 3 rooms","Coral Beach Villa — ৳15,000/night · 3 rooms"],rate:"Official published rates: ৳10,000–৳15,000 per villa/night",phone:"+8801675606060",capacity:"10 beachfront rooms across three villa categories.",facilities:["Beachfront villas","Breakfast included in published rates","24-hour electricity"],note:"Select travel dates to confirm the applicable seasonal rate. Confirm whether your group of five can share the selected two villas.",sources:[["Official website & room rates","https://coralhazestmartin.com/"],["Official contact","https://coralhazestmartin.com/contact"]]},
 {name:"Sand Castle Beach Resort",lat:20.6150,lng:92.3256,map:"https://maps.app.goo.gl/qX75ausuXtxLUmuD6",rooms:["Online listings show different room categories and inconsistent rates."],rate:"Current room rent: contact resort for a confirmed quote",phone:"",capacity:"One third-party listing shows 7 rooms; verify directly.",facilities:["Listed beside Marine Park, Golachipa."],note:"Online prices and location metadata conflict. This pin uses the Golachipa / Marine Park area; use the supplied Google Maps link for the resort's exact pin.",sources:[["Location and hotel listing","https://impt.io/hotels/bangladesh/chittagong/sand-castle-beach-resort-saint-martin/"],["Another booking listing","https://primebooking.com.bd/hotels/143"]]},
 {name:"Josnaloy Beach Resort",lat:20.621357,lng:92.323286,map:"https://maps.app.goo.gl/DAQ94eaYePLyu72b9",rooms:["Economy Couple — ৳4,500/night","Economy Double — ৳5,000/night","Deluxe Falguni — ৳5,500/night","Family Deluxe Rim Jhim — ৳6,000/night · listed for 4 adults + 2 children","Triple-bed Deluxe Falguni — ৳6,500/night · listed for 6 adults + 3 children","Premium couple cottages — ৳6,500–৳8,500/night","Exclusive villas/cottages — ৳9,000–৳10,000/night"],rate:"Published listing starts at ৳4,500 per room/night",phone:"+8801316568970",capacity:"13 room types listed. Some family rooms are listed for 4 adults + children; one triple-bed room for 6 adults + 3 children.",facilities:["Beach view","Attached washroom rooms"],note:"For five people in two rooms, ask for one family/double room plus a second suitable room. Confirm the exact bed layout and current rates.",sources:[["Room types, capacities & rates","https://ghuringfiring.com/resorts/josnaloy-beach-resort/"],["Geotagged resort photo","https://commons.wikimedia.org/wiki/File:Cottages_of_Josnaloy.jpg"]]},
 {name:"Blue Oasis Beach Resort",lat:20.608730,lng:92.325697,map:"https://maps.app.goo.gl/4HaJ87rWWphCEodB7",rooms:[],rate:"Not verified online",phone:"",capacity:"Not verified online.",facilities:[],note:"I could not verify reliable public room, rate or contact details for this exact Saint Martin resort. Its marker uses the previously supplied approximate position; open the Google Maps link to check the exact location.",sources:[]},
 {name:"Neel Hawa Beach Resort",lat:20.63320,lng:92.31890,map:"https://maps.app.goo.gl/7ZAMA8C2hZZaJQfb9",rooms:["Standard Suite — ৳6,000–৳7,500/night · 2 adults + 1 extra allowed","Premium Couple Cottage — ৳8,500/night · 2 adults + 2 extra allowed","Premium Cottage — ৳10,000/night · 4 adults","Presidential Suite — ৳10,000/night","Presidential Cottage — ৳12,000/night"],rate:"Published listing rates: ৳6,000–৳12,000 per room/night",phone:"+8801910909106",capacity:"Premium Cottage is listed for 4 adults; several suites/cottages allow extra guests.",facilities:["Sea-view options","Breakfast included in the cited booking listings"],note:"These are online booking-listing rates, not a confirmed quote. The resort contact page lists a Dhaka office address; confirm island location and room arrangements directly.",sources:[["Current room listings","https://resortsbd.com/resort/neelhawabeachresort"],["Published contact details","https://neelhawabeachresort.com/resort/coxs-bazar/contact-us"]]},
 {name:"Sun and Sand Twin Beach Resort",lat:20.6270,lng:92.3220,map:"https://maps.app.goo.gl/ePVc1kCAm1wtatde7",rooms:["Garden / standard villas — published from ৳16,000/night","Harmony Hideout Villa — published at ৳20,000/night","Beach Bliss Villa — published at ৳20,000/night"],rate:"Official website listings: ৳16,000–৳20,000 per villa/night",phone:"+8801880088905",capacity:"10 private villas and cottages. Some villas are listed for 2 guests; ask about an extra mattress for the fifth person.",facilities:["Double and king-sized beds","Wi-Fi and 24/7 security","Daily breakfast for two adults","Generator backup, housekeeping and beach-view villas"],note:"Confirm the room capacity and extra-bed charge for your group of five. Prices can vary by villa and date.",sources:[["Official website & room rates","https://www.snstwinbeach.com/"],["Official contact","https://www.snstwinbeach.com/contact"]]},
 {name:"Marine Beach Resort",lat:20.627643,lng:92.315415,map:"https://maps.app.goo.gl/bMdKzyDXgw3PchxC7",rooms:["Family Cottage — ৳4,200/night · 4 adults + up to 2 extra allowed on some listings","Special Couple Room — around ৳4,900–৳8,400/night depending on room","Duplex Family Cottage — ৳7,000/night · 4 adults + up to 2 extra allowed"],rate:"Online listing rates: approximately ৳4,200–৳8,400 per room/night",phone:"+8801932408449",capacity:"Family and duplex cottages may allow extra guests; confirm the selected room.",facilities:["Complimentary breakfast on listed room plans","Welcome drinks","Sea-view balcony options"],note:"The resort is listed at West Konapara on the west coast. Rates and availability change; confirm two double-bed rooms for five guests.",sources:[["Current room listings","https://www.resortsbd.com/resort/marinebeachresort"],["Official resort contact","https://www.marinebeachresort.com/contact.php"]]},
 {name:"Dipantor Beach Resort",lat:20.621601,lng:92.323117,map:"https://maps.app.goo.gl/zAZnQg5FpR4rH2mh9",rooms:["Premium Couple Villa — 2 guests","Premium Duplex Villa — 4 guests","Exclusive Couple Villa — 2 guests","Studio Couple Room — 2 guests","Studio Family Room — 4 guests"],rate:"Final rates are provided by the resort team; third-party listings have shown rates from around ৳8,000/night.",phone:"+8801886363232",capacity:"13 rooms and villas across 5 categories. Ask about extra guests and the 5-person arrangement.",facilities:["Full-board packages include breakfast, lunch and dinner, according to the official site."],note:"The resort's official site asks guests to contact the team for date-specific rates. Third-party prices are indicative only.",sources:[["Official rooms, contact & enquiry","https://dwipantorbeachresort.com/"],["Third-party listing","https://ghuringfiring.com/resorts/dwipantor-beach-resort/"]]}
];
const places=[
 {name:"Jetty Ghat",lat:20.63244,lng:92.32850,symbol:"⚓",desc:"Main jetty / arrival area on the north-eastern side of the island."},
 {name:"East Beach",lat:20.6160,lng:92.3290,symbol:"🌊",desc:"General east-facing shoreline marker. This indicates the beach area, not a single entrance."},
 {name:"West Beach",lat:20.6160,lng:92.3148,symbol:"🌅",desc:"General west-facing shoreline marker, popular for sunset views."},
 {name:"Chera Dwip",lat:20.58057,lng:92.33894,symbol:"🏝️",desc:"Southern island extension. The connection to the main island can be affected by tide; check local conditions before walking across."}
];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function resortHtml(r){
 const rooms=r.rooms.length?'<ul class="rooms">'+r.rooms.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<div class="small">No reliable room/rate information found for this exact listing.</div>';
 const contact=r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':'<span class="small">No verified public phone number found.</span>';
 const facilities=r.facilities.length?'<ul class="rooms">'+r.facilities.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':'<span class="small">Facilities not verified online.</span>';
 const sources=r.sources.length?'<div class="sources">'+r.sources.map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+' ↗</a>').join("")+'</div>':'<span class="small">No verified public source found yet.</span>';
 return '<div class="info"><div class="info-head"><div class="kicker">Resort · Saint Martin</div><h2>'+esc(r.name)+'</h2><div class="sub">Tap a source to check details directly</div></div><div class="info-body"><div class="section"><div class="section-title">Room types & rent</div>'+rooms+'<div class="rate">'+esc(r.rate)+'</div><div class="capacity">'+esc(r.capacity)+'</div></div><div class="section"><div class="section-title">Contact number</div>'+contact+'</div><div class="section"><div class="section-title">Facilities</div>'+facilities+'</div><div class="notice">'+esc(r.note)+' Prices and availability may change by date, season and occupancy. Confirm directly before booking.</div><div class="section" style="margin-top:10px"><div class="section-title">Information sources</div>'+sources+'</div><div class="actions"><a class="primary" href="'+esc(r.map)+'" target="_blank" rel="noopener">Open exact Google Maps pin ↗</a></div></div></div>';
}
const map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([20.610,92.324],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const bounds=[];
resorts.forEach(r=>{const m=L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:'<div class="resort-icon"><b>R</b></div>',iconSize:[29,29],iconAnchor:[14,27]})}).addTo(map);m.bindTooltip(r.name,{direction:"top",sticky:true});m.on("click",()=>L.popup({maxWidth:370,closeButton:true,autoPan:true,autoPanPaddingTopLeft:[20,90],autoPanPaddingBottomRight:[20,24]}).setLatLng([r.lat,r.lng]).setContent(resortHtml(r)).openOn(map));bounds.push([r.lat,r.lng]);});
places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:'<div class="place-icon">'+p.symbol+'</div>',iconSize:[29,29],iconAnchor:[14,14]})}).addTo(map);m.bindTooltip(p.name,{direction:"top",sticky:true});m.on("click",()=>L.popup({maxWidth:290}).setLatLng([p.lat,p.lng]).setContent('<div class="landmark"><div class="kicker">Island landmark</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.desc)+'</p></div>').openOn(map));bounds.push([p.lat,p.lng]);});
map.fitBounds(bounds,{padding:[42,42]});
</script>
</body>
